<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/fonts/plus-jakarta-sans-latin.woff2") format("woff2"); font-weight: 400 800; font-style: normal; }
      @font-face { font-family: "Fira Code"; src: url("assets/fonts/fira-code-latin.woff2") format("woff2"); font-weight: 400 500; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d0d12; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Plus Jakarta Sans", sans-serif; color: #f4f4f8; }
      #facebox { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #face { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #filmbox { position: absolute; left: 0; top: 0; width: 1080px; height: 820px; background: #0d0d12; overflow: hidden; }
      .film { position: absolute; left: 0; top: 150px; width: 1080px; height: 608px; }
      #tag { position: absolute; left: 60px; top: 66px; height: 56px; padding: 0 22px; border-radius: 28px; background: #1a1a23; border: 2px solid #2a2a36;
        font-weight: 700; font-size: 30px; line-height: 52px; white-space: nowrap; }
      #tag i { display: inline-block; width: 12px; height: 12px; margin-right: 12px; border-radius: 6px; background: #d4f53c; vertical-align: 2px; }
      #unused-brand { position: absolute; left: 60px; top: 80px; height: 60px; padding: 0 24px; border-radius: 30px; background: rgba(13, 13, 18, 0.9); font-family: "Fira Code", monospace; font-size: 30px; line-height: 60px; letter-spacing: 0.12em; color: #d4f53c; white-space: nowrap; }
      #proofcap { position: absolute; left: 0; top: 900px; width: 1080px; text-align: center; }
      #proofcap b { display: block; font-weight: 800; font-size: 66px; letter-spacing: -0.03em; line-height: 1.15; }
      #proofcap span { display: block; margin-top: 18px; font-size: 38px; color: #a9a9bb; }
      #endcard { position: absolute; inset: 0; background: #0d0d12; }
      #e-mark { position: absolute; left: 404px; top: 560px; width: 272px; height: 272px; }
      #e-mark svg { width: 272px; height: 272px; }
      #e-word { position: absolute; left: 0; top: 880px; width: 1080px; text-align: center; font-weight: 800; font-size: 132px; letter-spacing: -0.045em; }
      #e-line { position: absolute; left: 0; top: 1080px; width: 1080px; text-align: center; font-weight: 800; font-size: 84px; letter-spacing: -0.04em; white-space: nowrap; }
      #e-ai { position: relative; z-index: 0; isolation: isolate; display: inline-block; padding: 0 10px; color: #0d0d12; }
      #e-hl { position: absolute; left: 0; right: 0; bottom: -4px; height: 96px; background: #d4f53c; z-index: -1; transform-origin: 0 50%; }
      #e-btn { position: absolute; left: 190px; top: 1300px; width: 700px; height: 120px; border-radius: 24px; background: #d4f53c; color: #0d0d12;
        font-weight: 800; font-size: 54px; line-height: 120px; text-align: center; }
      #e-url { position: absolute; left: 0; top: 1460px; width: 1080px; text-align: center; font-size: 42px; color: #a9a9bb; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.3" data-width="1080" data-height="1920">

      </div>
      <div id="filmbox">
        <div id="tag" class="clip" data-start="5.4" data-duration="6.1" data-track-index="5" style="z-index: 5"><i></i>H Company agent · recorded run, demo portal</div>
        <div id="pn-dashv" class="clip" data-composition-id="dashv" data-composition-src="compositions/dashv.html" data-start="0.0" data-duration="4.0" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="820"></div>
        <div id="pn-path" class="clip" data-composition-id="path" data-composition-src="compositions/path.html" data-start="4.0" data-duration="1.4" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="820"></div>

        <div id="e-line">Let <span id="e-ai"><span id="e-hl"></span>AI</span> do the work.</div>
        <div id="e-btn">See it live, no signup</div>

      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="11.5" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 50"></div>

      <audio id="bgm" class="clip" src="assets/music/bed2-long.mp3" data-start="0" data-media-start="0.24" data-duration="20.3" data-track-index="20" data-volume="1" data-fade-in="0.4" data-fade-out="1.4" data-automation="{&quot;version&quot;: 1, &quot;lanes&quot;: [{&quot;target&quot;: &quot;volume&quot;, &quot;points&quot;: [{&quot;t&quot;: 0, &quot;v&quot;: 0.1}, {&quot;t&quot;: 11.3, &quot;v&quot;: 0.1}, {&quot;t&quot;: 11.8, &quot;v&quot;: 0.42}]}]}"></audio>

      <audio id="sfx-hit-5" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="11.83" data-duration="2.12" data-track-index="68" data-volume="0.35"></audio>
      <audio id="sfx-stamp-55" class="clip" src="assets/sfx/stamp.mp3" data-start="13.01" data-duration="0.8" data-track-index="69" data-volume="0.45"></audio>
      <audio id="sfx-hit-end" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="15.9" data-duration="2.59" data-track-index="70" data-volume="0.35"></audio>
      <audio id="sfx-pop-cta" class="clip" src="assets/sfx/pop.mp3" data-start="17.8" data-duration="0.72" data-track-index="71" data-volume="0.3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // From frame 0: Kerdaxis in action in the top panel, Kevin in the lower part of the frame.
      gsap.set("#face", { y: 560 });
      // Proof: the film box takes the whole top, the face is gone (the face clip ends at 11.5).
      tl.fromTo("#proofcap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 12.0);
      // End card.
      tl.fromTo("#e-mark", { opacity: 0, y: -240, rotation: -24, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 15.9);
      tl.fromTo("#e-word", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 16.2);
      tl.fromTo("#e-line", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 16.7);
      gsap.set("#e-hl", { scaleX: 0 });
      tl.to("#e-hl", { scaleX: 1, duration: 0.4, ease: "power3.out" }, 17.0);
      tl.fromTo("#e-btn", { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)" }, 17.8);
      tl.fromTo("#e-url", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 18.1);
      tl.set({}, {}, 20.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
