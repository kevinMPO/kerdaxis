  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Portal page units -> frame at 1.5x to start.
      gsap.set("#g-pw", { x: 0, y: 0, scale: 1.5 });
      gsap.set("#g-agent", { x: 428, y: 474 });
      gsap.set("#g-cur", { x: 1520, y: 1120 });

      // Match cut on the "No thanks" click: the confirmation page arrives slightly large.
      tl.fromTo("#g-pw", { scale: 1.56, x: -24, y: -14 }, { scale: 1.5, x: 0, y: 0, duration: 0.32, ease: "expo.out" }, 0);

      // As recorded: Kerdaxis pauses the agent as soon as the final page loads (box still unticked;
      // the agent ticks it only after the human's go, in the proof scene's capture).

      // Punch in on the red button (frame = 2.4 * page + (-154.4, -726.4)).
      tl.to("#g-pw", { scale: 2.4, x: -154.4, y: -726.4, duration: 0.6, ease: "power2.inOut" }, 1.2);
      
      // The agent moves onto the button and decelerates to a halt. It does not click.
      tl.to("#g-agent", { x: 467, y: 544, duration: 1.5, ease: "power3.out" }, 0.4);
      tl.to("#g-pill-b", { clipPath: "inset(0 0% 0 0)", duration: 0.32, ease: "power3.out" }, 2.5);
      tl.to("#g-pill-a", { opacity: 0, duration: 0.05, ease: "none" }, 2.57);
      tl.fromTo("#g-title span", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power4.out" }, 2.3);

      // Pull back: the agent's screen is carried back into the Kerdaxis panel.
      tl.to("#g-title span", { opacity: 0, filter: "blur(8px)", duration: 0.14, stagger: 0.02, ease: "power3.in" }, 4.72);
      tl.to(["#g-demo", "#g-pill-a", "#g-pill-b"], { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power3.in" }, 4.75);
      tl.to("#g-pw", { scale: 0.75, x: 760, y: 116, duration: 0.55, ease: "power2.inOut" }, 4.9);
      tl.to("#g-portal", { clipPath: "inset(116px 200px 424px 760px round 18px)", duration: 0.55, ease: "power2.inOut" }, 4.9);
      tl.to("#g-ring", { opacity: 1, duration: 0.15, ease: "none" }, 5.35);

      // Step 3 is now current; the status changes; the gate rises (argRise in the app).
      tl.set("#s1", { attr: { class: "st done" } }, 5.35);
      tl.set("#s1 .n", { textContent: "✓" }, 5.35);
      tl.set("#s2", { attr: { class: "st cur" } }, 5.35);
      tl.to("#g-st1", { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power3.in" }, 5.3);
      tl.fromTo("#g-st2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 5.42);
      tl.fromTo("#g-gate", { opacity: 0, y: 24, scale: 0.98, filter: "blur(6px)", transformOrigin: "50% 100%" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 5.4);

      // The human gives the final go.
      tl.to("#g-cur", { x: 857, y: 887, duration: 0.85, ease: "power2.inOut" }, 6.9);
      tl.to("#g-ok", { backgroundColor: "#255A49", duration: 0.1, ease: "none" }, 7.75);
      tl.to(["#g-ok", "#g-cur"], { scale: 0.97, duration: 0.07, ease: "power2.out" }, 8.0);
      tl.to(["#g-ok", "#g-cur"], { scale: 1, duration: 0.16, ease: "power3.out" }, 8.07);

      window.__timelines["gate"] = tl;
    })();
