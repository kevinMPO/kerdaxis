<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1440px;height:900px;background:#f4f2ee;font-family:"Helvetica Neue",Arial;overflow:hidden;display:grid;grid-template-columns:repeat(12,1fr);gap:20px;padding:40px;box-sizing:border-box}
h1{grid-column:1/9;font:700 120px/.92 "Helvetica Neue";letter-spacing:-.04em;margin:80px 0 0;color:#111}
.bar{grid-column:9/13;background:#e2231a;height:640px;margin-top:80px;position:relative}
.arc{position:absolute;left:-180px;bottom:120px;width:360px;height:360px;border-radius:50%;border:40px solid #111}
button{grid-column:1/4;align-self:start;background:#111;color:#fff;border:0;padding:20px;font:700 20px "Helvetica Neue"}
</style></head><body><h1>Cancelled. Confirmed. Counted.</h1><div class="bar"><div class="arc"></div></div><button>Open the live app</button></body></html>
