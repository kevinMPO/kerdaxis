# Déploie le site vitrine (site/ → Worker « kerdaxis-site », kerdaxis.com) à chaque push sur main.
name: Deploy site (kerdaxis.com)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5e83f0c9dfa04e17b2c4ac41851805bb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes wrangler@4 deploy
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://kerdaxis.com/)
          echo "/ $code"; [ "$code" = "200" ] || exit 1
